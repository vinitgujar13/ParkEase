{% extends "base.html" %}
{% block title %}Login - ParkEase{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-lock-fill me-2"></i>Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" action="/login">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="Password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Login
                    </button>
                </form>
                <hr>
                <p class="text-center mb-0">
                    New customer? <a href="/register">Register here</a>
                </p>
                <div class="mt-3 p-3 bg-light rounded small">
                    <strong>Demo Credentials:</strong><br>
                    Super Admin: admin@parking.local / Admin@123<br>
                    Facility Owner: owner1@parking.com / Owner@123<br>
                    Customer: demo@parking.local / Customer@123
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
